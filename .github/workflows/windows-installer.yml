name: Windows installer
# Builds JARVIS-OS-<version>-Setup-x64.exe on a Windows runner. Manual run → artifact; tag v* → attached to a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Backend smoke (fast subset)
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q tests/test_core.py tests/test_gate.py tests/test_windows_launcher.py
      - name: Build installer
        run: python scripts/build_windows_installer.py --download-runtime --compiler "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" --output "${{ runner.temp }}\jarvis-build"
      - name: Smoke-test the staged payload launcher
        run: |
          $payload = "${{ runner.temp }}\jarvis-build\payload"
          & "$payload\runtime\python.exe" -I "$payload\app\scripts\windows_launcher.py" --smoke-test --data-dir "${{ runner.temp }}\jarvis-smoke" --report "${{ runner.temp }}\jarvis-build\smoke.json"
          Get-Content "${{ runner.temp }}\jarvis-build\smoke.json"
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-OS-windows-installer
          path: |
            ${{ runner.temp }}/jarvis-build/*.exe
            ${{ runner.temp }}/jarvis-build/*.sha256
            ${{ runner.temp }}/jarvis-build/smoke.json
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes (Get-ChildItem "${{ runner.temp }}\jarvis-build\*.exe", "${{ runner.temp }}\jarvis-build\*.sha256" | ForEach-Object { $_.FullName })
