services:
  core:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      JARVIS_API_KEY: ${JARVIS_API_KEY:?Set JARVIS_API_KEY in .env}
      JARVIS_DB: /app/data/jarvis.db
      JARVIS_SQLITE_TIMEOUT_SECONDS: ${JARVIS_SQLITE_TIMEOUT_SECONDS:-15}
      JARVIS_SESSION_MINUTES: ${JARVIS_SESSION_MINUTES:-60}
      JARVIS_API_REQUESTS_PER_MINUTE: ${JARVIS_API_REQUESTS_PER_MINUTE:-600}
      JARVIS_LOGIN_ATTEMPTS_PER_MINUTE: ${JARVIS_LOGIN_ATTEMPTS_PER_MINUTE:-10}
      JARVIS_CORS_ORIGINS: ${JARVIS_CORS_ORIGINS:-}
      JARVIS_POSTGRES_DSN: ${JARVIS_POSTGRES_DSN:-}
      JARVIS_POSTGRES_MEMORY_ENABLED: ${JARVIS_POSTGRES_MEMORY_ENABLED:-false}
      JARVIS_POSTGRES_CONNECT_TIMEOUT_SECONDS: ${JARVIS_POSTGRES_CONNECT_TIMEOUT_SECONDS:-5}
      JARVIS_POSTGRES_STATEMENT_TIMEOUT_MS: ${JARVIS_POSTGRES_STATEMENT_TIMEOUT_MS:-5000}
      JARVIS_POSTGRES_LOCK_TIMEOUT_MS: ${JARVIS_POSTGRES_LOCK_TIMEOUT_MS:-1000}
      OLLAMA_URL: http://host.docker.internal:11434
      AUTOLOGIKA_READONLY_ENABLED: ${AUTOLOGIKA_READONLY_ENABLED:-false}
      AUTOLOGIKA_URL: ${AUTOLOGIKA_URL:-http://host.docker.internal:8787}
      AUTOLOGIKA_PIN: ${AUTOLOGIKA_PIN:-}
      JARVIS_NETWORK_ALLOWLIST: ${JARVIS_NETWORK_ALLOWLIST:-127.0.0.0/8,::1/128}
      HA_READONLY_ENABLED: ${HA_READONLY_ENABLED:-false}
      HA_URL: ${HA_URL:-}
      HA_TOKEN: ${HA_TOKEN:-}
      HA_ALLOWED_ENTITIES: ${HA_ALLOWED_ENTITIES:-}
      TWILIO_WEBHOOK_ENABLED: ${TWILIO_WEBHOOK_ENABLED:-false}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PUBLIC_ORIGIN: ${TWILIO_PUBLIC_ORIGIN:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      WHATSAPP_ALLOWED_SENDERS: ${WHATSAPP_ALLOWED_SENDERS:-}
      OLLAMA_ALLOWED_MODELS: ${OLLAMA_ALLOWED_MODELS:-qwen2.5:3b}
      JARVIS_ALLOW_CLOUD_MODELS: ${JARVIS_ALLOW_CLOUD_MODELS:-false}
      JARVIS_OPENAI_ENABLED: ${JARVIS_OPENAI_ENABLED:-false}
      JARVIS_OPENAI_API_KEY: ${JARVIS_OPENAI_API_KEY:-}
      JARVIS_OPENAI_URL: ${JARVIS_OPENAI_URL:-https://api.openai.com}
      JARVIS_OPENAI_MODEL: ${JARVIS_OPENAI_MODEL:-gpt-5.4-mini-2026-03-17}
      JARVIS_LLM_MAX_OUTPUT_TOKENS: ${JARVIS_LLM_MAX_OUTPUT_TOKENS:-1024}
      JARVIS_TOOL_CHAT_ENABLED: ${JARVIS_TOOL_CHAT_ENABLED:-false}
      JARVIS_OPENAI_INPUT_USD_PER_MILLION: ${JARVIS_OPENAI_INPUT_USD_PER_MILLION:-}
      JARVIS_OPENAI_OUTPUT_USD_PER_MILLION: ${JARVIS_OPENAI_OUTPUT_USD_PER_MILLION:-}
      JARVIS_OPENAI_MAX_REQUEST_USD: ${JARVIS_OPENAI_MAX_REQUEST_USD:-}
      AUTOLOGIKA_SNAPSHOT_ENABLED: ${AUTOLOGIKA_SNAPSHOT_ENABLED:-false}
      AUTOLOGIKA_SNAPSHOT_PATH: /app/data/autologika/workshop.snapshot.sqlite3
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      JARVIS_VOICE_ENABLED: ${JARVIS_VOICE_ENABLED:-false}
      WYOMING_STT_URI: ${WYOMING_STT_URI:-tcp://host.docker.internal:10300}
      WYOMING_TTS_URI: ${WYOMING_TTS_URI:-tcp://host.docker.internal:10200}
      WYOMING_TTS_VOICE: ${WYOMING_TTS_VOICE:-}
      JARVIS_EMBEDDINGS_ENABLED: ${JARVIS_EMBEDDINGS_ENABLED:-false}
      OLLAMA_EMBED_URL: ${OLLAMA_EMBED_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-}
      MEMORY_EMBEDDING_REVISION: ${MEMORY_EMBEDDING_REVISION:-1}
      JARVIS_RECEPTION_AI_ENABLED: ${JARVIS_RECEPTION_AI_ENABLED:-false}
      OLLAMA_RECEPTION_URL: ${OLLAMA_RECEPTION_URL:-http://host.docker.internal:11434}
      OLLAMA_RECEPTION_MODEL: ${OLLAMA_RECEPTION_MODEL:-qwen2.5:3b}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["jarvis-data:/app/data"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  scheduler:
    build: .
    profiles: [automation]
    command: ["python", "-m", "jarvis.worker"]
    environment:
      CORE_URL: http://core:8000
      JARVIS_SCHEDULER_TOKEN: ${JARVIS_SCHEDULER_TOKEN:-}
    depends_on:
      core:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:stable}
    profiles: [n8n]
    ports: ["127.0.0.1:5678:5678"]
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      GENERIC_TIMEZONE: Europe/Warsaw
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes: ["n8n-data:/home/node/.n8n"]
volumes:
  jarvis-data:
  n8n-data:
